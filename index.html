<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สุ่มจับกลุ่มชิวๆ (Random Group Generator)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            margin: 0;
            overflow-x: hidden;
            background-color: #87CEEB; /* Sky blue fallback */
            color: #333;
        }

        .landscape-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: linear-gradient(to bottom, #a1c4fd 0%, #c2e9fb 100%);
        }

        .sun {
            position: absolute;
            top: 10%;
            right: 15%;
            width: 100px;
            height: 100px;
            background: #FFD700;
            border-radius: 50%;
            box-shadow: 0 0 50px #FFD700;
            animation: pulseSun 4s infinite alternate;
        }

        .cloud {
            position: absolute;
            background: #fff;
            border-radius: 50px;
            opacity: 0.8;
            animation: moveClouds linear infinite;
        }

        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: #fff;
            border-radius: 50%;
        }

        .cloud1 {
            width: 120px; height: 40px; top: 15%; left: -150px;
            animation-duration: 45s;
        }
        .cloud1::before { width: 60px; height: 60px; top: -30px; left: 15px; }
        .cloud1::after { width: 40px; height: 40px; top: -15px; left: 65px; }

        .cloud2 {
            width: 180px; height: 60px; top: 25%; left: -200px;
            animation-duration: 60s; animation-delay: 10s;
        }
        .cloud2::before { width: 80px; height: 80px; top: -40px; left: 25px; }
        .cloud2::after { width: 60px; height: 60px; top: -25px; left: 95px; }

        .mountain {
            position: absolute;
            bottom: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-bottom: 300px solid #7cb342;
            z-index: 1;
        }

        .mountain-bg {
            position: absolute;
            bottom: 0;
            border-left: 200px solid transparent;
            border-right: 200px solid transparent;
            border-bottom: 400px solid #558b2f;
            z-index: 0;
        }

        .m1 { left: 10%; bottom: -50px; }
        .m2 { right: 20%; bottom: -80px; }
        .m-bg1 { left: -5%; bottom: -20px; opacity: 0.7; }
        .m-bg2 { right: 5%; bottom: -40px; opacity: 0.7; }

        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 20vh;
            background: #8bc34a;
            z-index: 2;
        }
        
        .grass {
            position: absolute;
            bottom: 20vh;
            width: 100%;
            height: 20px;
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 10px,
                #689f38 10px,
                #689f38 15px
            );
            z-index: 2;
        }

        @keyframes moveClouds {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(100vw + 200px)); }
        }

        @keyframes pulseSun {
            0% { transform: scale(1); box-shadow: 0 0 40px #FFD700; }
            100% { transform: scale(1.05); box-shadow: 0 0 60px #FFD700, 0 0 100px #FF8C00; }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(0,0,0,0.3);
        }

        /* Modal styling */
        #error-modal {
            display: none;
        }
        #error-modal.active {
            display: flex;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex items-center justify-center relative">

    <div class="landscape-container">
        <div class="sun"></div>
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        
        <div class="mountain-bg m-bg1"></div>
        <div class="mountain-bg m-bg2"></div>
        
        <div class="mountain m1"></div>
        <div class="mountain m2"></div>
        
        <div class="grass"></div>
        <div class="ground"></div>
    </div>

    <main class="w-full max-w-4xl glass-panel rounded-2xl p-6 md:p-8 z-10 relative flex flex-col md:flex-row gap-8">
        
        <!-- Left Column: Controls -->
        <div class="w-full md:w-1/2 flex flex-col gap-5">
            <div class="text-center md:text-left border-b border-gray-200 pb-4">
                <h1 class="text-3xl font-bold text-teal-700 mb-1">จัดกลุ่มชิวๆ 🍃</h1>
                <p class="text-sm text-gray-500">ระบบสุ่มจับกลุ่มสำหรับ502</p>
            </div>

            <!-- Group Type Selection -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">1. เลือกรูปแบบกลุ่ม</label>
                <select id="group-size-select" class="w-full p-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-teal-500 bg-white shadow-sm transition-all">
                    <option value="2">จับคู่ (กลุ่มละ 2 คน)</option>
                    <option value="3">กลุ่มละ 3 คน</option>
                    <option value="4">กลุ่มละ 4 คน</option>
                    <option value="5">กลุ่มละ 5 คน</option>
                    <option value="6">กลุ่มละ 6 คน</option>
                    <option value="7">กลุ่มละ 7 คน</option>
                    <option value="8">กลุ่มละ 8 คน</option>
                    <option value="9">กลุ่มละ 9 คน</option>
                    <option value="10">กลุ่มละ 10 คน</option>
                </select>
            </div>

            <!-- Number of Items/People -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">2. จำนวนคน/สิ่งของทั้งหมด (ตัวเลข)</label>
                <div class="flex items-center gap-3">
                    <input type="number" id="total-items" min="2" max="100" value="10" class="w-full p-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-teal-500 bg-white shadow-sm">
                    <span class="text-gray-500 text-sm whitespace-nowrap">คน (หมายเลข 1 ถึง N)</span>
                </div>
            </div>

            <!-- Number of Groups Wanted -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">3. ต้องการแบ่งเป็นกี่กลุ่ม?</label>
                <div class="flex items-center gap-3">
                    <input type="number" id="num-groups" min="1" value="5" class="w-full p-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-teal-500 bg-white shadow-sm">
                    <button id="calc-groups-btn" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 rounded-lg text-xs font-medium transition-colors border border-gray-300 whitespace-nowrap">
                        คำนวณอัตโนมัติ
                    </button>
                </div>
                <p id="group-info-text" class="text-xs text-teal-600 mt-2 h-4"></p>
            </div>

            <div class="bg-white/50 p-4 rounded-xl border border-gray-200">
                <label class="block text-sm font-semibold text-gray-700 mb-2">4. เงื่อนไข: ห้ามอยู่กลุ่มเดียวกัน</label>
                <p class="text-xs text-gray-500 mb-3">ระบุหมายเลขที่ไม่ต้องการให้อยู่ด้วยกัน</p>
                
                <div class="flex gap-2 mb-3">
                    <input type="number" id="const-item1" placeholder="เลขที่ 1" class="w-1/2 p-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-red-400 text-sm">
                    <span class="flex items-center text-gray-400 text-sm">ห้ามคู่</span>
                    <input type="number" id="const-item2" placeholder="เลขที่ 2" class="w-1/2 p-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-red-400 text-sm">
                    <button id="add-constraint-btn" class="bg-red-500 hover:bg-red-600 text-white p-2 rounded-lg transition-colors font-bold shadow-sm">
                        +
                    </button>
                </div>
                
                <ul id="constraints-list" class="space-y-2 max-h-32 overflow-y-auto custom-scrollbar pr-2">
                    <!-- Constraints will be added here -->
                </ul>
            </div>

            <button id="generate-btn" class="w-full bg-gradient-to-r from-teal-500 to-emerald-500 hover:from-teal-600 hover:to-emerald-600 text-white font-bold py-4 px-6 rounded-xl shadow-lg transform transition hover:scale-[1.02] active:scale-[0.98] mt-2 text-lg">
                🎲 เริ่มสุ่มจับกลุ่ม
            </button>
        </div>

        <div class="w-full md:w-1/2 bg-white/80 rounded-xl border border-gray-200 p-5 flex flex-col h-[600px]">
            <div class="flex justify-between items-center mb-4 border-b border-gray-200 pb-3">
                <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                    <span>📋</span> ผลการจัดกลุ่ม
                </h2>
                <button id="copy-btn" class="hidden bg-gray-100 hover:bg-gray-200 text-gray-700 py-1.5 px-3 rounded-lg text-sm font-medium transition-colors border border-gray-300 flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    คัดลอก
                </button>
            </div>
            
            <div id="results-container" class="flex-grow overflow-y-auto custom-scrollbar pr-2 space-y-4">
                <div class="h-full flex flex-col items-center justify-center text-gray-400 opacity-70">
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="mb-4"><circle cx="12" cy="12" r="10"></circle><polyline points="12 16 16 12 12 8"></polyline><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                    <p>ยังไม่มีการสุ่ม กรุณากด "เริ่มสุ่มจับกลุ่ม"</p>
                </div>
            </div>
        </div>
    </main>

    <div id="error-modal" class="fixed inset-0 bg-black/50 z-50 items-center justify-center backdrop-blur-sm">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full mx-4 shadow-2xl transform transition-all scale-100">
            <div class="flex items-center gap-3 mb-4 text-amber-500">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                <h3 class="text-lg font-bold text-gray-800">แจ้งเตือน</h3>
            </div>
            <p id="error-message" class="text-gray-600 mb-6 text-sm"></p>
            <div class="flex justify-end">
                <button id="close-modal-btn" class="bg-gray-800 hover:bg-gray-900 text-white py-2 px-5 rounded-xl transition-colors font-medium">
                    เข้าใจแล้ว
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM Elements
            const groupSizeSelect = document.getElementById('group-size-select');
            const totalItemsInput = document.getElementById('total-items');
            const numGroupsInput = document.getElementById('num-groups');
            const calcGroupsBtn = document.getElementById('calc-groups-btn');
            const groupInfoText = document.getElementById('group-info-text');
            
            const constItem1Input = document.getElementById('const-item1');
            const constItem2Input = document.getElementById('const-item2');
            const addConstraintBtn = document.getElementById('add-constraint-btn');
            const constraintsList = document.getElementById('constraints-list');
            
            const generateBtn = document.getElementById('generate-btn');
            const resultsContainer = document.getElementById('results-container');
            const copyBtn = document.getElementById('copy-btn');
            
            const errorModal = document.getElementById('error-modal');
            const errorMessage = document.getElementById('error-message');
            const closeModalBtn = document.getElementById('close-modal-btn');

            // State
            let constraints = []; // Array of pairs e.g. [[1,3], [2,4]]
            
            const showModal = (message) => {
                errorMessage.textContent = message;
                errorModal.classList.add('active');
            };

            closeModalBtn.addEventListener('click', () => {
                errorModal.classList.remove('active');
            });

            // Update auto-calculation text when inputs change
            const updateCalculationInfo = () => {
                const total = parseInt(totalItemsInput.value) || 0;
                const targetSize = parseInt(groupSizeSelect.value) || 2;
                
                if (total > 0) {
                    const idealGroups = Math.ceil(total / targetSize);
                    const remainder = total % idealGroups;
                    
                    if (remainder === 0) {
                        groupInfoText.textContent = `จำนวนที่แนะนำ: ${idealGroups} กลุ่ม (ลงตัวกลุ่มละ ${total/idealGroups} คน)`;
                    } else {
                        const baseSize = Math.floor(total / idealGroups);
                        const largerGroups = total % idealGroups;
                        const smallerGroups = idealGroups - largerGroups;
                        groupInfoText.textContent = `แนะนำ: ${idealGroups} กลุ่ม (มี ${largerGroups} กลุ่มที่มี ${baseSize+1} คน, ${smallerGroups} กลุ่มที่มี ${baseSize} คน)`;
                    }
                }
            };

            totalItemsInput.addEventListener('input', updateCalculationInfo);
            groupSizeSelect.addEventListener('change', updateCalculationInfo);

            calcGroupsBtn.addEventListener('click', () => {
                const total = parseInt(totalItemsInput.value) || 0;
                const targetSize = parseInt(groupSizeSelect.value) || 2;
                if (total > 0) {
                    numGroupsInput.value = Math.ceil(total / targetSize);
                }
            });

            const renderConstraints = () => {
                constraintsList.innerHTML = '';
                if (constraints.length === 0) {
                    constraintsList.innerHTML = '<li class="text-xs text-gray-400 italic">ยังไม่มีเงื่อนไข</li>';
                    return;
                }

                constraints.forEach((pair, index) => {
                    const li = document.createElement('li');
                    li.className = 'flex justify-between items-center bg-red-50 text-red-700 px-3 py-2 rounded-lg text-sm border border-red-100';
                    li.innerHTML = `
                        <span>หมายเลข <b>${pair[0]}</b> ห้ามอยู่กับ <b>${pair[1]}</b></span>
                        <button class="text-red-400 hover:text-red-700 p-1" onclick="removeConstraint(${index})">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                    `;
                    constraintsList.appendChild(li);
                });
            };

            // Expose to window for inline onclick handler
            window.removeConstraint = (index) => {
                constraints.splice(index, 1);
                renderConstraints();
            };

            addConstraintBtn.addEventListener('click', () => {
                const val1 = parseInt(constItem1Input.value);
                const val2 = parseInt(constItem2Input.value);
                const maxItems = parseInt(totalItemsInput.value);

                if (isNaN(val1) || isNaN(val2)) {
                    showModal("กรุณาระบุหมายเลขให้ครบทั้ง 2 ช่อง");
                    return;
                }
                if (val1 === val2) {
                    showModal("ไม่สามารถตั้งเงื่อนไขตัวเลขเดียวกันได้");
                    return;
                }
                if (val1 < 1 || val1 > maxItems || val2 < 1 || val2 > maxItems) {
                    showModal(`หมายเลขต้องอยู่ระหว่าง 1 ถึง ${maxItems}`);
                    return;
                }

                // Check for duplicates
                const isDuplicate = constraints.some(pair => 
                    (pair[0] === val1 && pair[1] === val2) || 
                    (pair[0] === val2 && pair[1] === val1)
                );

                if (isDuplicate) {
                    showModal("เงื่อนไขนี้มีอยู่แล้ว");
                    return;
                }

                // Standardize order (smaller number first) to easily check
                const newConstraint = val1 < val2 ? [val1, val2] : [val2, val1];
                constraints.push(newConstraint);
                
                constItem1Input.value = '';
                constItem2Input.value = '';
                constItem1Input.focus();
                
                renderConstraints();
            });

            // Initialize empty constraints list
            renderConstraints();
            updateCalculationInfo();

            // Fisher-Yates shuffle
            const shuffleArray = (array) => {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            };

            // Check if adding item to group violates any constraints
            const isValidPlacement = (item, group, allConstraints) => {
                for (let member of group) {
                    for (let constraint of allConstraints) {
                        if ((constraint[0] === item && constraint[1] === member) ||
                            (constraint[1] === item && constraint[0] === member)) {
                            return false;
                        }
                    }
                }
                return true;
            };

            const generateGroups = () => {
                const totalItems = parseInt(totalItemsInput.value);
                const numGroups = parseInt(numGroupsInput.value);
                
                if (isNaN(totalItems) || totalItems < 2) {
                    showModal("กรุณาระบุจำนวนคนทั้งหมดให้ถูกต้อง (อย่างน้อย 2)");
                    return;
                }
                if (isNaN(numGroups) || numGroups < 1) {
                    showModal("กรุณาระบุจำนวนกลุ่มที่ต้องการให้ถูกต้อง (อย่างน้อย 1)");
                    return;
                }
                if (numGroups > totalItems) {
                    showModal("จำนวนกลุ่มไม่สามารถมากกว่าจำนวนคนได้");
                    return;
                }

                // Add spinning animation to button
                const originalBtnText = generateBtn.innerHTML;
                generateBtn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> กำลังสุ่ม...`;
                generateBtn.disabled = true;

                // Use setTimeout to allow UI to update to loading state
                setTimeout(() => {
                    let items = Array.from({length: totalItems}, (_, i) => i + 1);
                    
                    // Determine base capacity for each group
                    const baseSize = Math.floor(totalItems / numGroups);
                    const remainder = totalItems % numGroups;
                    
                    const groupCapacities = new Array(numGroups).fill(baseSize);
                    for(let i=0; i<remainder; i++) {
                        groupCapacities[i]++;
                    }

                    // Try to generate valid groups with backtracking/retries
                    const maxRetries = 500; 
                    let bestGroups = [];
                    let bestUnplaced = totalItems;
                    let success = false;

                    for (let attempt = 0; attempt < maxRetries; attempt++) {
                        let currentItems = shuffleArray([...items]);
                        let groups = Array.from({length: numGroups}, () => []);
                        let unplaced = [];

                        // Greedily place items while respecting constraints and capacity
                        for (let item of currentItems) {
                            let placed = false;
                            
                            // Try to put item in random available group
                            let availableGroupsIndices = shuffleArray(Array.from(groups.keys()));
                            
                            for (let gIndex of availableGroupsIndices) {
                                if (groups[gIndex].length < groupCapacities[gIndex] && 
                                    isValidPlacement(item, groups[gIndex], constraints)) {
                                    groups[gIndex].push(item);
                                    placed = true;
                                    break;
                                }
                            }

                            if (!placed) {
                                unplaced.push(item);
                            }
                        }

                        if (unplaced.length === 0) {
                            bestGroups = groups;
                            success = true;
                            break;
                        }

                        // Keep track of best partial solution
                        if (unplaced.length < bestUnplaced) {
                            bestUnplaced = unplaced.length;
                            bestGroups = groups;
                        }
                    }

                    resultsContainer.innerHTML = '';
                    
                    if (!success) {
                        // If we couldn't place everyone due to constraints
                        const warningDiv = document.createElement('div');
                        warningDiv.className = 'bg-amber-100 border-l-4 border-amber-500 text-amber-700 p-4 mb-4 rounded shadow-sm';
                        warningDiv.innerHTML = `
                            <p class="font-bold text-sm">สุ่มสำเร็จแต่ไม่สมบูรณ์</p>
                            <p class="text-xs">เนื่องจากเงื่อนไขที่ตั้งไว้ ทำให้ไม่สามารถจัดทุกคนเข้ากลุ่มตามจำนวนกลุ่มที่กำหนดได้พอดี ระบบได้พยายามจัดให้ดีที่สุดแล้ว</p>
                        `;
                        resultsContainer.appendChild(warningDiv);
                    }

                    // Render Final Groups
                    bestGroups.forEach((group, index) => {
                        const groupCard = document.createElement('div');
                        groupCard.className = 'bg-white border border-gray-200 p-4 rounded-xl shadow-sm hover:shadow-md transition-shadow';
                        
                        // Icon based on group size selection
                        const targetSize = parseInt(groupSizeSelect.value);
                        let icon = targetSize === 2 ? '👥' : '👨‍👩‍👧‍👦';
                        
                        let badgeColor = 'bg-teal-100 text-teal-800';
                        if(index % 3 === 1) badgeColor = 'bg-blue-100 text-blue-800';
                        if(index % 3 === 2) badgeColor = 'bg-purple-100 text-purple-800';

                        groupCard.innerHTML = `
                            <div class="flex justify-between items-center mb-3">
                                <h3 class="font-bold text-gray-800 flex items-center gap-2">
                                    <span>${icon}</span> กลุ่มที่ ${index + 1}
                                </h3>
                                <span class="text-xs px-2 py-1 rounded-full ${badgeColor} font-semibold">
                                    ${group.length} คน
                                </span>
                            </div>
                            <div class="flex flex-wrap gap-2">
                                ${group.length > 0 
                                    ? group.map(num => `<span class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-gray-100 border border-gray-300 text-gray-700 font-medium text-sm shadow-sm">${num}</span>`).join('') 
                                    : '<span class="text-sm text-gray-400">ไม่มีสมาชิก</span>'
                                }
                            </div>
                        `;
                        resultsContainer.appendChild(groupCard);
                    });

                    copyBtn.classList.remove('hidden');

                    // Reset button
                    generateBtn.innerHTML = '🎲 เริ่มสุ่มจับกลุ่ม';
                    generateBtn.disabled = false;

                }, 500); // 500ms delay to show the "spinning" animation for effect
            };

            generateBtn.addEventListener('click', generateGroups);

            copyBtn.addEventListener('click', () => {
                let textToCopy = "ผลการสุ่มจัดกลุ่ม:\n\n";
                const groupCards = resultsContainer.querySelectorAll('.bg-white');
                
                if(groupCards.length === 0) return;

                groupCards.forEach((card, index) => {
                    const membersSpans = card.querySelectorAll('.w-8');
                    const members = Array.from(membersSpans).map(span => span.textContent).join(', ');
                    textToCopy += `กลุ่มที่ ${index + 1}: [ ${members} ]\n`;
                });

                // Fallback for clipboard API in iframes
                const textArea = document.createElement("textarea");
                textArea.value = textToCopy;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    
                    // Visual feedback
                    const originalHTML = copyBtn.innerHTML;
                    copyBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-green-600"><polyline points="20 6 9 17 4 12"></polyline></svg> คัดลอกแล้ว!`;
                    copyBtn.classList.add('bg-green-50', 'border-green-200');
                    
                    setTimeout(() => {
                        copyBtn.innerHTML = originalHTML;
                        copyBtn.classList.remove('bg-green-50', 'border-green-200');
                    }, 2000);
                } catch (err) {
                    showModal("ไม่สามารถคัดลอกได้ในเบราว์เซอร์นี้");
                }
                document.body.removeChild(textArea);
            });
        });
    </script>
</body>
</html>
